x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Redis: redis:6379
    OrderExpiration__LifetimeSeconds: 15
    OrderExpiration__ScanIntervalSeconds: 1
    OrderLimits__MaxVolume: 100000
    OrderLimits__MaxNotional: 10000000
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  api-1:
    <<: *api
  api-2:
    <<: *api

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
